<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>CompanyChat</title>
<meta name="color-scheme" content="light dark">
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; font: 15px system-ui, sans-serif; background: #000; color: #e5e5e5; text-align: center; }
  h1 { font-size: 20px; margin: 0 0 8px; } p { margin: 4px 0; color: #a3a3a3; }
  button { margin-top: 16px; padding: 8px 16px; border-radius: 8px; border: 0; background: #22c55e; color: #000; font-weight: 600; cursor: pointer; }
</style></head>
<body><div><h1>Can't reach CompanyChat</h1><p>Check your internet connection. We'll keep trying.</p>
<button onclick="location.href = new URLSearchParams(location.search).get('retry')">Try again</button></div>
<script>
  const target = new URLSearchParams(location.search).get('retry')
  setInterval(() => fetch(target, { mode: 'no-cors', cache: 'no-store' }).then(() => { location.href = target }).catch(() => {}), 5000)
</script></body></html>
